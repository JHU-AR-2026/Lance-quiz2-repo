<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Babylon.js WebXR Sinusoidal Tasks</title>

  <script src="https://cdn.babylonjs.com/babylon.js"></script>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #111;
    }

    #renderCanvas {
      width: 100%;
      height: 100%;
      touch-action: none;
      display: block;
    }

    #panel {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 10;
      max-width: 360px;
      padding: 12px 14px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.72);
      color: white;
      font-size: 14px;
      line-height: 1.4;
    }

    #panel h1 {
      margin: 0 0 8px;
      font-size: 17px;
    }

    #panel p {
      margin: 5px 0;
    }

    .controls {
      display: grid;
      gap: 6px;
      margin-top: 10px;
    }

    button {
      padding: 8px 10px;
      border: 0;
      border-radius: 7px;
      cursor: pointer;
      font-weight: 600;
    }

    #status {
      margin-top: 8px;
      font-size: 12px;
      opacity: 0.85;
    }
  </style>
</head>

<body>
  <div id="panel">
    <h1>WebXR Sinusoidal Tasks</h1>
    <p><b>Task 1:</b> cube color changes sinusoidally.</p>
    <p><b>Task 2:</b> sphere position changes sinusoidally.</p>
    <p><b>Task 3:</b> cylinder scale changes sinusoidally.</p>
    <p><b>Quest right controller:</b> A = Task 1, B = Task 2, Trigger = Task 3.</p>

    <div class="controls">
      <button id="task1Button">Task 1: Active</button>
      <button id="task2Button">Task 2: Active</button>
      <button id="task3Button">Task 3: Active</button>
    </div>

    <div id="status">Initializing Babylon.js and WebXR…</div>
  </div>

  <canvas id="renderCanvas"></canvas>
  <script src="./app.js"></script>
</body>
</html>
